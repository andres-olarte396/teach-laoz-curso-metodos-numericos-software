<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#333" stroke-width="2" />
  <line x1="50" y1="50" x2="50" y2="250" stroke="#333" stroke-width="2" />
  
  <!-- Function Curve (Parabolic segment) -->
  <path d="M 80 220 Q 200 180 320 50" fill="none" stroke="#007bff" stroke-width="3" />
  <text x="330" y="60" font-family="Arial" font-size="12" fill="#007bff">f(x)</text>

  <!-- Current Point x_i -->
  <circle cx="280" cy="100" r="4" fill="#ff4d4d" />
  <line x1="280" y1="250" x2="280" y2="100" stroke="#ff4d4d" stroke-dasharray="4" />
  <text x="275" y="270" font-family="Arial" font-size="12">x_i</text>

  <!-- Tangent Line -->
  <line x1="330" y1="45" x2="180" y2="250" stroke="#ff9900" stroke-width="2" />
  <text x="200" y="220" font-family="Arial" font-size="10" fill="#ff9900" transform="rotate(-53, 200, 220)">TANGENTE</text>

  <!-- Next Point x_{i+1} -->
  <circle cx="180" cy="250" r="4" fill="#4dff4d" />
  <text x="160" y="270" font-family="Arial" font-size="12" font-weight="bold">x_{i+1}</text>

  <!-- Root -->
  <circle cx="150" cy="195" r="3" fill="#333" />
  <text x="140" y="215" font-family="Arial" font-size="10">RAÍZ REAL</text>
</svg>
