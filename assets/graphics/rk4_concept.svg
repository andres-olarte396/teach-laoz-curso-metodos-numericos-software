<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Puntos de muestreo -->
  <rect x="50" y="80" width="100" height="40" rx="5" fill="#f8f9fa" stroke="#333"/>
  <text x="100" y="105" font-family="Arial" font-size="12" text-anchor="middle">Inicio (k1)</text>

  <line x1="150" y1="100" x2="190" y2="100" stroke="#ccc" stroke-width="2"/>

  <rect x="200" y="80" width="200" height="40" rx="5" fill="#e7f1ff" stroke="#007bff"/>
  <text x="300" y="105" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Medio (k2, k3)</text>

  <line x1="400" y1="100" x2="440" y2="100" stroke="#ccc" stroke-width="2"/>

  <rect x="450" y="80" width="100" height="40" rx="5" fill="#f8f9fa" stroke="#333"/>
  <text x="500" y="105" font-family="Arial" font-size="12" text-anchor="middle">Final (k4)</text>

  <!-- Promedio -->
  <path d="M 300 120 L 300 160" stroke="#28a745" stroke-width="3" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="300" y="185" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#28a745">PROMEDIO PONDERADO (RK4)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745" />
    </marker>
  </defs>
</svg>
