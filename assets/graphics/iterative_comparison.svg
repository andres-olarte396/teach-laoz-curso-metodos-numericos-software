<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Jacobi Box -->
  <rect x="50" y="50" width="200" height="100" rx="10" fill="#f8f9fa" stroke="#007bff" stroke-width="2"/>
  <text x="150" y="40" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Jacobi</text>
  <text x="150" y="90" font-family="Arial" font-size="12" text-anchor="middle">Usa valores de la</text>
  <text x="150" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#007bff">ITERACIÓN ANTERIOR</text>
  
  <line x1="260" y1="100" x2="340" y2="100" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Gauss-Seidel Box -->
  <rect x="350" y="50" width="200" height="100" rx="10" fill="#f8f9fa" stroke="#28a745" stroke-width="2"/>
  <text x="450" y="40" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Gauss-Seidel</text>
  <text x="450" y="90" font-family="Arial" font-size="12" text-anchor="middle">Usa valores</text>
  <text x="450" y="110" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#28a745">RECIÉN CALCULADOS</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc" />
    </marker>
  </defs>
</svg>
