<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Exact Solution (Blue) -->
  <path d="M 50 100 Q 150 150 350 200" fill="none" stroke="#007bff" stroke-width="2" opacity="0.3"/>
  <text x="355" y="200" font-family="Arial" font-size="10" fill="#007bff">Real</text>

  <!-- Euler Steps (Red) -->
  <line x1="50" y1="100" x2="150" y2="120" stroke="#ff4d4d" stroke-width="3"/>
  <line x1="150" y1="120" x2="250" y2="160" stroke="#ff4d4d" stroke-width="3"/>
  <line x1="250" y1="160" x2="350" y2="220" stroke="#ff4d4d" stroke-width="3"/>
  
  <circle cx="50" cy="100" r="4" fill="#ff4d4d"/>
  <circle cx="150" cy="120" r="4" fill="#ff4d4d"/>
  <circle cx="250" cy="160" r="4" fill="#ff4d4d"/>
  <circle cx="350" cy="220" r="4" fill="#ff4d4d"/>

  <!-- Error indicator -->
  <line x1="350" y1="200" x2="350" y2="220" stroke="#ff4d4d" stroke-dasharray="2"/>
  <text x="360" y="215" font-family="Arial" font-size="10" fill="#ff4d4d">Error Acumulado</text>

  <text x="200" y="30" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Euler: El Problema del Paso Finito</text>
</svg>
