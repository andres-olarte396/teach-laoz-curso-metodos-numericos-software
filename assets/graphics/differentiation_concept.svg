<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Axis -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- Curve -->
  <path d="M 50 180 Q 200 150 350 50" fill="none" stroke="#6f42c1" stroke-width="3"/>
  
  <!-- Points -->
  <circle cx="150" cy="155" r="4" fill="#ff4d4d"/>
  <text x="150" y="175" font-family="Arial" font-size="10" text-anchor="middle">f(x)</text>
  
  <circle cx="250" cy="115" r="4" fill="#ff4d4d"/>
  <text x="250" y="135" font-family="Arial" font-size="10" text-anchor="middle">f(x+h)</text>
  
  <!-- Secant Line -->
  <line x1="100" y1="175" x2="300" y2="95" stroke="#ff4d4d" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Tangent line (exact) -->
  <line x1="100" y1="180" x2="300" y2="100" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="100" font-family="Arial" font-size="10" fill="#28a745">Tangente Real</text>

  <text x="200" y="30" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Diferenciación: La Pendiente Discreta</text>
</svg>
