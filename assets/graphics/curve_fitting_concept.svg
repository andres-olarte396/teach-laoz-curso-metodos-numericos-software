<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid -->
  <path d="M 50 200 L 350 200" stroke="#eee" stroke-width="2"/>
  
  <!-- Cloud of points -->
  <circle cx="80" cy="180" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="120" cy="150" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="150" cy="165" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="200" cy="120" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="250" cy="135" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="280" cy="110" r="4" fill="#ff4d4d" opacity="0.6"/>
  <circle cx="320" cy="90" r="4" fill="#ff4d4d" opacity="0.6"/>
  
  <!-- Regression Line -->
  <line x1="60" y1="185" x2="340" y2="85" stroke="#007bff" stroke-width="3"/>
  
  <!-- Error bars (Residues) -->
  <line x1="150" y1="165" x2="150" y2="153" stroke="#007bff" stroke-dasharray="2"/>
  <line x1="250" y1="135" x2="250" y2="117" stroke="#007bff" stroke-dasharray="2"/>

  <!-- Labels -->
  <text x="200" y="30" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Ajuste: Tendencia General</text>
  <text x="200" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Minimiza el error global (ruido)</text>
</svg>
