<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Cycle Boxes -->
  <rect x="50" y="80" width="120" height="60" rx="10" fill="#f8f9fa" stroke="#007bff" stroke-width="2"/>
  <text x="110" y="115" font-family="Arial" font-size="12" text-anchor="middle">Input: Estado Inicial</text>
  
  <rect x="240" y="80" width="120" height="60" rx="10" fill="#e7f1ff" stroke="#007bff" stroke-width="2"/>
  <text x="300" y="115" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Física: RK4</text>
  
  <rect x="430" y="80" width="120" height="60" rx="10" fill="#f8f9fa" stroke="#007bff" stroke-width="2"/>
  <text x="490" y="115" font-family="Arial" font-size="12" text-anchor="middle">Render: Gráfica</text>

  <!-- Arrows -->
  <line x1="170" y1="110" x2="235" y2="110" stroke="#007bff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="110" x2="425" y2="110" stroke="#007bff" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Loop Arrow -->
  <path d="M 300 140 Q 300 200 110 200 L 110 145" fill="none" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="215" font-family="Arial" font-size="10" fill="#666">Iteración temporal (dt)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007bff" />
    </marker>
  </defs>

  <text x="300" y="30" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Arquitectura de un Simulador Físico</text>
</svg>
