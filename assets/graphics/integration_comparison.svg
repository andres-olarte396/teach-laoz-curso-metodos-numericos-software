<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Trapezoid -->
  <path d="M 50 200 L 250 200 L 250 80 L 50 150 Z" fill="rgba(220, 53, 69, 0.1)" stroke="#dc3545" stroke-width="2"/>
  <path d="M 50 150 Q 150 100 250 80" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4"/>
  <text x="150" y="235" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Regla del Trapecio</text>
  <text x="150" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Líneas rectas)</text>

  <!-- Simpson -->
  <path d="M 350 200 L 550 200 L 550 80 Q 450 100 350 150 Z" fill="rgba(40, 167, 69, 0.1)" stroke="#28a745" stroke-width="2"/>
  <path d="M 350 150 Q 450 100 550 80" fill="none" stroke="#28a745" stroke-width="2"/>
  <text x="450" y="235" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Reglas de Simpson</text>
  <text x="450" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">(Arcos parabólicos)</text>
</svg>
