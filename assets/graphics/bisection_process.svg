<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Axis -->
  <line x1="50" y1="200" x2="450" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- Curve -->
  <path d="M 50 180 Q 250 150 450 50" fill="none" stroke="#007bff" stroke-width="3"/>
  
  <!-- Intervals -->
  <!-- Step 1 -->
  <line x1="100" y1="210" x2="100" y2="190" stroke="#ff4d4d" stroke-width="2"/>
  <text x="100" y="230" font-family="Arial" font-size="12" text-anchor="middle">a</text>
  <line x1="400" y1="210" x2="400" y2="190" stroke="#ff4d4d" stroke-width="2"/>
  <text x="400" y="230" font-family="Arial" font-size="12" text-anchor="middle">b</text>
  
  <!-- Midpoint -->
  <line x1="250" y1="210" x2="250" y2="190" stroke="#28a745" stroke-width="2" stroke-dasharray="4"/>
  <text x="250" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#28a745">m = (a+b)/2</text>
  
  <!-- Arrows -->
  <path d="M 230 225 L 120 225" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 270 225 L 380 225" stroke="#ccc" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc" />
    </marker>
  </defs>
  
  <text x="250" y="30" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Método de Bisección: Dividir para Vencer</text>
</svg>
